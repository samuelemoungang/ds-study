<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Science Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --bg2:#141a22; --panel:#171e27; --panel2:#1d2630;
    --ink:#e8edf2; --mut:#8b97a6; --line:#27313d;
    --acc:#7ee787;        /* terminal green */
    --acc2:#58a6ff;       /* blue */
    --warn:#ffa657; --err:#ff7b72; --good:#3fb950;
    --r:16px;
    --mono:'JetBrains Mono',monospace;
    --sans:'Spline Sans',system-ui,sans-serif;
    --disp:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(88,166,255,.10), transparent 60%),
      radial-gradient(700px 500px at 5% 0%, rgba(126,231,135,.08), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}

  /* header */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:30px}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:grid;place-items:center;color:#0b0e13;font-family:var(--mono);
    font-weight:700;font-size:20px;box-shadow:0 6px 22px rgba(88,166,255,.25);
  }
  h1{font-family:var(--disp);font-weight:600;font-size:30px;margin:0;letter-spacing:-.01em}
  #tagline{color:var(--acc2);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;margin:3px 0 0}
  #subline{color:var(--mut);font-size:14px;margin:8px 0 0;max-width:520px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
  .lang button{
    background:transparent;border:0;color:var(--mut);font-family:var(--mono);
    font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;transition:.15s;
  }
  .lang button.active{background:var(--acc2);color:#08111f}
  .lang button:hover:not(.active){color:var(--ink)}

  /* home grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{
    position:relative;text-align:left;cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:var(--r);
    padding:22px 20px 18px;color:var(--ink);font-family:inherit;
    transition:.18s ease;overflow:hidden;
    animation:rise .5s both;animation-delay:var(--d);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-3px);border-color:var(--acc2);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card-ix{position:absolute;top:16px;right:18px;font-family:var(--mono);font-size:12px;color:var(--line);font-weight:700}
  .card:hover .card-ix{color:var(--acc2)}
  .card-icon{font-size:26px;display:block}
  .card-icon.big{font-size:34px}
  .card h3{font-family:var(--disp);font-weight:600;font-size:20px;margin:12px 0 4px}
  .card p{color:var(--mut);font-size:13.5px;margin:0 0 14px;min-height:38px}
  .card-meta{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.02em}

  /* module page */
  .mod-head{margin-bottom:22px}
  .mod-title{display:flex;gap:14px;align-items:center;margin:14px 0 6px}
  .mod-title h2{font-family:var(--disp);font-size:26px;margin:0;font-weight:600}
  .mod-title p{color:var(--mut);font-size:13.5px;margin:2px 0 0}
  .pickmode{color:var(--mut);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:22px}
  .link-btn{background:0;border:0;color:var(--acc2);font-family:var(--mono);font-size:13px;cursor:pointer;padding:0}
  .link-btn:hover{text-decoration:underline}

  .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.mode-row{grid-template-columns:1fr}}
  .mode-card{
    text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
    border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;
    background:var(--panel);transition:.18s;
  }
  .mode-card.quiz:hover{border-color:var(--acc2);box-shadow:0 10px 26px rgba(88,166,255,.18);transform:translateY(-2px)}
  .mode-card.code:hover{border-color:var(--acc);box-shadow:0 10px 26px rgba(126,231,135,.18);transform:translateY(-2px)}
  .mode-em{font-family:var(--mono);font-size:30px;font-weight:700}
  .mode-card.quiz .mode-em{color:var(--acc2)}
  .mode-card.code .mode-em{color:var(--acc)}
  .mode-card h3{font-family:var(--disp);font-size:21px;margin:10px 0 4px;font-weight:600}
  .mode-card p{color:var(--mut);font-size:13px;margin:0 0 16px}
  .go{font-family:var(--mono);font-size:12.5px;font-weight:700}
  .mode-card.quiz .go{color:var(--acc2)} .mode-card.code .go{color:var(--acc)}

  /* topbar in-session */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .tb-mid{font-family:var(--mono);font-size:12px;color:var(--mut);flex:1 1 auto;min-width:120px}
  .track{flex:2 1 160px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:999px;transition:width .35s}
  .tb-score{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap}

  /* panel */
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:28px 26px;animation:fade .3s both;
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel.center{text-align:center}
  .qnum{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);margin-bottom:10px}
  .qtext{font-family:var(--disp);font-weight:500;font-size:23px;line-height:1.35;margin:0 0 22px}

  /* quiz options */
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--acc2);background:#202a36}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--good);background:rgba(63,185,80,.14);color:#9ff5b0}
  .opt.bad{border-color:var(--err);background:rgba(255,123,114,.12);color:#ffb3ad}

  /* feedback */
  .feedback{opacity:0;height:0;overflow:hidden;font-family:var(--mono);font-size:13px;margin-top:0;transition:.2s}
  .feedback.show{opacity:1;height:auto;margin-top:16px}
  .feedback.good{color:var(--good)} .feedback.err{color:var(--warn)}

  /* buttons */
  .primary,.ghost{
    font-family:var(--mono);font-weight:700;font-size:13.5px;cursor:pointer;
    border-radius:10px;padding:12px 22px;border:1px solid transparent;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .primary{background:var(--acc2);color:#08111f}
  .primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .ghost:hover{border-color:var(--acc2);color:var(--acc2)}
  .btn-row{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .panel:not(.center) .primary{margin-top:22px}

  /* code drill */
  .codeblock{
    font-family:var(--mono);font-size:14.5px;line-height:2.05;white-space:pre-wrap;
    background:#0b0f15;border:1px solid var(--line);border-radius:12px;
    padding:20px 18px;color:#c9d3df;overflow-x:auto;
  }
  .blank{
    font-family:var(--mono);font-size:14px;font-weight:600;
    background:#1a2230;border:1px solid var(--acc2);border-radius:6px;
    color:var(--acc);padding:2px 8px;min-width:48px;outline:none;
    margin:0 1px;transition:.12s;
  }
  .blank:focus{box-shadow:0 0 0 3px rgba(88,166,255,.25)}
  .blank.ok{border-color:var(--good);color:#9ff5b0;background:rgba(63,185,80,.12)}
  .blank.bad{border-color:var(--err);color:#ffb3ad;background:rgba(255,123,114,.1)}
  .hintbox{
    margin-top:14px;font-size:13px;color:var(--mut);font-family:var(--sans);
    background:var(--panel2);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;
  }

  /* result ring */
  .result-ring{
    --p:0;width:130px;height:130px;border-radius:50%;margin:8px auto 18px;
    display:grid;place-items:center;
    background:conic-gradient(var(--acc2) calc(var(--p)*1%), var(--line) 0);
    position:relative;
  }
  .result-ring.code{background:conic-gradient(var(--acc) calc(var(--p)*1%), var(--line) 0)}
  .result-ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
  .result-ring span{position:relative;z-index:1;font-family:var(--mono);font-weight:700;font-size:24px}
  .panel.center h2{font-family:var(--disp);font-size:26px;margin:0 0 8px;font-weight:600}
  .big{font-size:17px;margin:4px 0} .muted{color:var(--mut)} .small{font-size:12.5px}

  footer{text-align:center;color:var(--line);font-family:var(--mono);font-size:11px;margin-top:40px}
  footer b{color:var(--mut)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">DS</div>
        <div>
          <h1>Data Science Study Hub</h1>
          <p id="tagline"></p>
          <p id="subline"></p>
        </div>
      </div>
      <div class="lang">
        <button id="langEn">EN</button>
        <button id="langFr">FR</button>
      </div>
    </header>

    <main id="app"></main>

    <footer>built from lecture slides · <b>HES-SO Valais — Module 376</b> · S.&nbsp;Dürr · T.&nbsp;Gentilhomme</footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
